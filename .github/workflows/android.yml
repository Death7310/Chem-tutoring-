name: Android app

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # The runner image includes the Android SDK.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      # A signing key made for this build only, so no key is ever stored in the repository.
      - name: Create signing key
        run: |
          password=$(openssl rand -hex 24)
          echo "::add-mask::$password"
          echo "KEYSTORE_PASSWORD=$password" >> "$GITHUB_ENV"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - run: |
          keytool -genkeypair -keystore "$KEYSTORE_FILE" -alias chemtutor -keyalg RSA -keysize 2048 \
            -validity 10000 -storepass "$KEYSTORE_PASSWORD" -keypass "$KEYSTORE_PASSWORD" -dname "CN=Chem Tutor"
      - run: gradle -p android assembleRelease --no-daemon
      - run: cp android/app/build/outputs/apk/release/app-release.apk chem-tutor.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Chem Tutor for Android
          make_latest: true
          body: |
            Download **chem-tutor.apk** below on your Android phone and open it to install.
            Allow "install unknown apps" for your browser or Files app if asked.
            The app loads the Chem Tutor website, so most updates arrive without reinstalling.
            If you ever install a newer APK, uninstall the old one first (back up your study data in Settings).
          files: chem-tutor.apk
